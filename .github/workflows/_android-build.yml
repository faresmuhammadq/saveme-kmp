name: android-build

# Reusable: builds one environment's release APK, signs it with the shared release key, uploads it as an artifact
# and publishes it as a GitHub release named saveme-<flavor>-<version>.apk.
# Every environment is signed with the same key, so each APK installs over the previous one without losing data.

on:
  workflow_call:
    inputs:
      flavor:
        description: Gradle flavor name in lower case (staging or prod)
        required: true
        type: string
      host:
        description: Backend host:port baked into the build as its default (changeable in the app)
        required: true
        type: string
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_KEYSTORE_PASSWORD:
        required: true
      ANDROID_KEY_ALIAS:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          SAVEME_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SAVEME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAVEME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAVEME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          FLAVOR: ${{ inputs.flavor }}
          HOST: ${{ inputs.host }}
        run: |
          task="assemble$(echo "${FLAVOR:0:1}" | tr a-z A-Z)${FLAVOR:1}Release"
          ./gradlew ":androidApp:$task" \
            "-P${FLAVOR}ApiHost=$HOST" \
            "-PversionCode=$((100 + GITHUB_RUN_NUMBER))" \
            --no-daemon --stacktrace

      - name: Verify signature and name the APK
        id: apk
        env:
          FLAVOR: ${{ inputs.flavor }}
        run: |
          version=$(sed -n 's/^versionName=//p' gradle.properties | tr -d '[:space:]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versionName '$version' is not semver"; exit 1; }
          apk=$(ls androidApp/build/outputs/apk/"$FLAVOR"/release/*.apk | head -n1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt"
          mkdir -p dist
          cp "$apk" "dist/saveme-${FLAVOR}-${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=dist/saveme-${FLAVOR}-${version}.apk" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: saveme-${{ inputs.flavor }}-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      # Needed to de-obfuscate crash stack traces of this exact build.
      - uses: actions/upload-artifact@v4
        with:
          name: saveme-${{ inputs.flavor }}-r8-mapping
          path: androidApp/build/outputs/mapping/${{ inputs.flavor }}Release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          FLAVOR: ${{ inputs.flavor }}
          VERSION: ${{ steps.apk.outputs.version }}
          FILE: ${{ steps.apk.outputs.file }}
        run: |
          tag="${FLAVOR}-v${VERSION}-build${GITHUB_RUN_NUMBER}"
          # Staging builds are pre-releases so they never become the repository's "latest" release.
          if [ "$FLAVOR" = prod ]; then channel=(--latest); else channel=(--prerelease --latest=false); fi
          notes="Save Me ${FLAVOR} ${VERSION} (build ${GITHUB_RUN_NUMBER}), commit ${GITHUB_SHA::7}. Installs over the previous ${FLAVOR} build."
          if gh release view "$tag" >/dev/null 2>&1; then
            # A re-run of the same run number: replace the asset.
            gh release upload "$tag" "$FILE" --clobber
          else
            gh release create "$tag" "$FILE" --target "$GITHUB_SHA" --title "saveme-${FLAVOR}-${VERSION} (build ${GITHUB_RUN_NUMBER})" --notes "$notes" "${channel[@]}"
          fi

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
