name: android-staging

# Builds the signed staging APK (com.fares.saveme.staging) on GitHub.

# Disabled while SaveMe is single-user and unreleased: nothing runs on push. Signed APKs are built
# locally in Docker with scripts/build-apk.sh. Still runnable by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-staging
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_android-build.yml
    with:
      flavor: staging
      host: ${{ vars.STAGING_API_HOST || 'saveme-staging.lab.internal' }}
    secrets: inherit
