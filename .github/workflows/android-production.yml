name: android-production

# Builds the signed production APK (com.fares.saveme) on GitHub.

# Disabled while SaveMe is single-user and unreleased: nothing runs on push. Signed APKs are built
# locally in Docker with scripts/build-apk.sh. Still runnable by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-production
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/_android-build.yml
    with:
      flavor: prod
      host: ${{ vars.PROD_API_HOST || 'saveme-production.lab.internal' }}
    secrets: inherit
