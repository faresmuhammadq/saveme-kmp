# deferred: E2E on owner's device (owner policy 2026-10-04)
# US3-S4: Given a well-formed code that does not exist, When it is redeemed, Then the message says it is not valid.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- evalScript: ${output.typed = 'AAAA-BBBB-CCCC-DDDD'.replace(/-/g, '')}
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-redeem.yaml
- tapOn:
    id: "redeem.code"
- inputText: "${output.typed}"
- hideKeyboard
- tapOn:
    id: "redeem.submit"
- extendedWaitUntil:
    visible:
      id: "redeem.message"
    timeout: 20000
- assertVisible:
    id: "redeem.message"
    text: "This code isn.t valid. Check it and try again."

