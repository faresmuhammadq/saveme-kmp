# US3-S7: Given a transaction deleted on another device while the phone edits it, When the edit is sent, Then "Restore with my change" brings it back with the phone's values. Part 1: online, the list loaded.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Fares", KIND: "expense" }
- runFlow:
    file: ../common/seed-transaction.yaml
    env: { WALLET: "Alpha", AMOUNT: "1000", NOTE: "Taxi" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-transactions.yaml
    env: { WALLET: "Alpha" }
- assertVisible: "Taxi"
# e2e-between: network-off
