# US2-S5: Given another device edits and deletes transactions, When the person pulls to refresh, Then the changes are shown.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Fares", KIND: "expense" }
- runFlow:
    file: ../common/seed-transaction.yaml
    env: { WALLET: "Alpha", AMOUNT: "1000", NOTE: "Edit me" }
- runFlow:
    file: ../common/seed-transaction.yaml
    env: { WALLET: "Alpha", AMOUNT: "2000", NOTE: "Delete me" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-transactions.yaml
    env: { WALLET: "Alpha" }
- assertVisible: "Edit me"
- assertVisible: "Delete me"
- runScript:
    file: ../common/api.js
    env: { ACTION: saveTransaction, SLOT: B, WALLET: "Alpha", NOTE: "Edit me", NEW_NOTE: "Edited elsewhere" }
- runScript:
    file: ../common/api.js
    env: { ACTION: deleteTransaction, SLOT: B, WALLET: "Alpha", NOTE: "Delete me" }
- swipe:
    from: { id: "transactions.list" }
    direction: DOWN
- extendedWaitUntil:
    visible: "Edited elsewhere"
    timeout: 30000
- assertNotVisible: "Delete me"
