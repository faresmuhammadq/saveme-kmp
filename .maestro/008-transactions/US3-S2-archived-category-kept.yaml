# US3-S2: Given a transaction whose category was archived on another device, When the person edits it, Then the archived category stays selected (C5 SC-007).
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Fares", KIND: "expense" }
- runFlow:
    file: ../common/seed-transaction.yaml
    env: { WALLET: "Alpha", AMOUNT: "1000", NOTE: "Taxi" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-transactions.yaml
    env: { WALLET: "Alpha" }
- runScript:
    file: ../common/api.js
    env: { ACTION: archiveCategory, SLOT: B, CATEGORY: "Fares" }
- tapOn: "Taxi"
- extendedWaitUntil:
    visible:
      id: "txEditor.category"
    timeout: 15000
- assertVisible: "Fares"
