# Part 3: the answer is a clash; both amounts show and the person chooses.
appId: com.fares.saveme
tags:
  - US3
---
- extendedWaitUntil:
    visible: "Changed on another device."
    timeout: 60000
- tapOn:
    id: "transactions.row.0"
- extendedWaitUntil:
    visible:
      id: "txEditor.keepMine"
    timeout: 15000
- assertVisible: "This phone: EGP 60.00"
- assertVisible: "Other device: EGP 90.00"
- tapOn:
    id: "txEditor.keepMine"
- extendedWaitUntil:
    notVisible: "Changed on another device."
    timeout: 60000
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runScript:
    file: ../common/api.js
    env: { ACTION: listTransactions, SLOT: B, WALLET: "Alpha" }
- assertTrue: ${output.transactions[0].amount_minor == 6000 }
