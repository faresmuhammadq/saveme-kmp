# US1-S6: Given the editor, When the person adds a note, details, a person and the cleared mark, Then they are saved and shown on the detail; a 101-character note is refused.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US1
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Fares", KIND: "expense" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-transactions.yaml
    env: { WALLET: "Alpha" }
- tapOn:
    id: "tab.add"
- extendedWaitUntil:
    visible:
      id: "txEditor.amount"
    timeout: 15000
- tapOn:
    id: "txEditor.amount"
- inputText: "12"
- hideKeyboard
- tapOn:
    id: "txEditor.category"
- extendedWaitUntil:
    visible: "Fares"
    timeout: 15000
- tapOn: "Fares"
- tapOn:
    id: "txEditor.note"
- inputText: "Plumber visit"
- tapOn:
    id: "txEditor.more"
- tapOn:
    id: "txEditor.details"
- inputText: "Bathroom pipe"
- tapOn:
    id: "txEditor.person"
- inputText: "Ahmed"
- hideKeyboard
- tapOn:
    id: "txEditor.cleared"
- tapOn:
    id: "txEditor.save"
- extendedWaitUntil:
    visible: "Plumber visit"
    timeout: 15000
- tapOn: "Plumber visit"
- extendedWaitUntil:
    visible:
      id: "txEditor.save"
    timeout: 15000
- assertVisible: "Plumber visit"
- tapOn:
    id: "txEditor.more"
- assertVisible: "Bathroom pipe"
- assertVisible: "Ahmed"
- tapOn:
    id: "txEditor.note"
- eraseText: 120
- inputText: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
- hideKeyboard
- assertVisible: "Use at most 100 characters."
