# Part 3: the deletion clashes; the person chooses.
appId: com.fares.saveme
tags:
  - US3
---
- extendedWaitUntil:
    visible: "Changed on another device."
    timeout: 60000
- tapOn:
    id: "transactions.row.0"
- extendedWaitUntil:
    visible:
      id: "txEditor.keepTransaction"
    timeout: 15000
- tapOn:
    id: "txEditor.keepTransaction"
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runScript:
    file: ../common/api.js
    env: { ACTION: listTransactions, SLOT: B, WALLET: "Alpha" }
- assertTrue: ${output.transactionCount == 1 }
