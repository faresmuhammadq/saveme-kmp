# US1-S2: Given a connection, When the person records an expense of 45.50 in a category, Then it is listed under Today, the wallet balance drops by 45.50 and the server has it.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US1
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Fares", KIND: "expense" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-transactions.yaml
    env: { WALLET: "Alpha" }
- runFlow:
    file: ../common/add-expense.yaml
    env: { AMOUNT: "45.50", CATEGORY: "Fares" }
- assertVisible: "Today"
- assertVisible:
    id: "transactions.row.0"
- assertVisible: "−EGP 45.50"
- assertVisible: "EGP 54.50"
- runScript:
    file: ../common/api.js
    env: { ACTION: listTransactions, SLOT: B, WALLET: "Alpha" }
- assertTrue: ${output.transactionCount == 1}
- assertTrue: ${output.transactions[0].amount_minor == 4550}
