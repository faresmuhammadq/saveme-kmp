# US3-S4/S5: Given a recorded transaction, When the person deletes it, Then the confirmation names the amount and date, and on confirming the row and its effect on the balance are gone.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Fares", KIND: "expense" }
- runFlow:
    file: ../common/seed-transaction.yaml
    env: { WALLET: "Alpha", AMOUNT: "1000", NOTE: "Taxi" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-transactions.yaml
    env: { WALLET: "Alpha" }
- tapOn: "Taxi"
- extendedWaitUntil:
    visible:
      id: "txEditor.delete"
    timeout: 15000
- tapOn:
    id: "txEditor.delete"
- extendedWaitUntil:
    visible: "Delete this transaction?"
    timeout: 15000
- assertVisible: ".*EGP 10.00.*"
# Dialog buttons are not tagged for Maestro (dialog windows don't expose tags): tapped by text.
- tapOn: "Delete transaction"
- extendedWaitUntil:
    visible:
      id: "transactions.list"
    timeout: 15000
- assertNotVisible: "Taxi"
- assertVisible: "EGP 100.00"
