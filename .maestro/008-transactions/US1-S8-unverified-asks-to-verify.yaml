# US1-S8: Given a person whose email address is not verified, When they try to record a transaction, Then the app asks them to verify their address first and nothing is queued.
# e2e-seed: unverified-user
appId: com.fares.saveme
tags:
  - US1
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-transactions.yaml
    env: { WALLET: "Alpha" }
- tapOn:
    id: "tab.add"
- extendedWaitUntil:
    visible: "Verify your email to do this. Check your inbox."
    timeout: 15000
- assertVisible: "Resend email"
- assertNotVisible:
    id: "txEditor.amount"
