# US3-S2: Given the wallet's type, When the owner edits the wallet, Then the type is shown but cannot be changed.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-wallets.yaml
- tapOn: "Alpha"
- tapOn:
    id: "walletDetail.edit"
- extendedWaitUntil:
    visible:
      id: "walletEditor.type"
    timeout: 15000
- assertVisible: "Cash"
- assertNotVisible:
    id: "walletEditor.type.credit_card"
