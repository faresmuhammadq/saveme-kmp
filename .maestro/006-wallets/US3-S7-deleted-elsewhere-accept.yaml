# US3-S7: Given a waiting edit to a wallet deleted on another device, When it is sent, Then the detail says the wallet was deleted on another device and offers only "Accept the deletion"; accepting removes the wallet from the phone.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-wallets.yaml
- tapOn: "Alpha"
- extendedWaitUntil:
    visible:
      id: "walletDetail.edit"
    timeout: 15000
- runScript:
    file: ../common/api.js
    env: { ACTION: deleteWallet, SLOT: B, WALLET: "Alpha" }
- tapOn:
    id: "walletDetail.edit"
- tapOn:
    id: "walletEditor.name"
- eraseText: 20
- inputText: "Edited"
- hideKeyboard
- tapOn:
    id: "walletEditor.save"
- extendedWaitUntil:
    visible: "Deleted on another device."
    timeout: 30000
- assertVisible:
    id: "walletDetail.acceptDeletion"
- assertNotVisible:
    id: "walletDetail.keepMine"
- tapOn:
    id: "walletDetail.acceptDeletion"
- extendedWaitUntil:
    visible:
      id: "wallets.empty"
    timeout: 20000
