# US5-S1: Given a wallet, When its detail shows the members, Then each member shows their name, their role, and "You" for the person; no email address is shown.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US5
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "10000" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-wallets.yaml
- tapOn: "Alpha"
- extendedWaitUntil:
    visible:
      id: "walletDetail.member.0"
    timeout: 20000
- assertVisible: "You"
- assertVisible: "Owner"
- assertNotVisible: ".*@example.com"
