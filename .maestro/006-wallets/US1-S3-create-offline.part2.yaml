# e2e-between: network-off
# Part 2: the phone's route to the backend is cut; the wallet is saved on the phone only.
appId: com.fares.saveme
tags:
  - US1
---
- runFlow:
    file: ../common/create-wallet.yaml
    env:
      NAME: "Cash offline"
      AMOUNT: "250"
- assertVisible: "Cash offline"
- assertVisible: "Waiting to sync"
- assertVisible: "EGP 250.00"
