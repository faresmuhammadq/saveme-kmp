# US3-S6: Given a new password shorter than 8 characters or longer than 128, When the person tries to submit, Then the field shows the specific rule and nothing is sent.
# e2e-seed: verified-user+reset-link
appId: com.fares.saveme
tags:
  - US3
---
- runFlow: ../common/launch-clean.yaml
- openLink:
    link: ${E2E_LINK}
    autoVerify: true
- tapOn:
    id: "resetPassword.password"
- inputText: "short"
- hideKeyboard
- tapOn:
    id: "resetPassword.submit"
- assertVisible: "Use at least 8 characters\\."
# Append 124 characters to "short" -> 129.
- tapOn:
    id: "resetPassword.password"
- inputText: "abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789abcd"
- hideKeyboard
- tapOn:
    id: "resetPassword.submit"
- assertVisible: "Use at most 128 characters\\."
# Nothing was sent: the old password still signs in.
- runScript:
    file: ../common/api.js
    env: { ACTION: expectLogin, EXPECT: "200" }
