# deferred: E2E on owner's device
# US2-S2: Given the phone is signed out, When an invitation link opens, Then the app asks to sign in or create an account, and after sign-in shows the invitation.
# e2e-seed: verified-user+plus+partner
# The runner provides E2E_PARTNER_EMAIL / E2E_PARTNER_PASSWORD (a second verified account, also on Plus) for seeds ending in +partner.
appId: com.fares.saveme
tags:
  - US2
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: C, EMAIL: "${E2E_PARTNER_EMAIL}", PASSWORD: "${E2E_PARTNER_PASSWORD}" }
- runScript:
    file: ../common/api.js
    env: { ACTION: createWallet, SLOT: C, NAME: "Shared Home", OPENING: "50000" }
- runScript:
    file: ../common/api.js
    env: { ACTION: createInvitation, SLOT: C, ROLE: editor }
- runFlow: ../common/launch-clean.yaml
- openLink:
    link: ${output.shareUrl}
    autoVerify: true
- extendedWaitUntil:
    visible:
      id: "invitation.signIn"
    timeout: 30000
- tapOn:
    id: "invitation.signIn"
- runFlow: ../common/sign-in-attempt.yaml
- extendedWaitUntil:
    visible:
      id: "invitation.join"
    timeout: 60000
