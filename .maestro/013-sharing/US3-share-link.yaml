# deferred: E2E on owner's device
# US3-S1: Given an owner on Plus, When they create a link invitation, Then once the server answers Share and Copy are offered (the share sheet opens).
# e2e-seed: verified-user+plus+partner
# The runner provides E2E_PARTNER_EMAIL / E2E_PARTNER_PASSWORD (a second verified account, also on Plus) for seeds ending in +partner.
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runScript:
    file: ../common/api.js
    env: { ACTION: createWallet, SLOT: B, NAME: "Alpha", OPENING: "10000" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-wallets.yaml
- tapOn: "Alpha"
- extendedWaitUntil:
    visible:
      id: "walletDetail.manageMembers"
    timeout: 20000
- tapOn:
    id: "walletDetail.manageMembers"
- extendedWaitUntil:
    visible:
      id: "members.list"
    timeout: 15000
- tapOn:
    id: "members.invite"
- extendedWaitUntil:
    visible:
      id: "invite.email"
    timeout: 15000
- tapOn:
    id: "invite.channel.link"
- tapOn:
    id: "invite.send"
- extendedWaitUntil:
    visible:
      id: "invite.ready"
    timeout: 30000
- assertVisible:
    id: "invite.copy"
- tapOn:
    id: "invite.share"
# The system share sheet is a system window; leave it with Back.
- pressKey: back
- assertVisible:
    id: "invite.done"
