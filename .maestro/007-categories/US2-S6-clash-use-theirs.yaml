# US2-S6: Given the clash choice, When the person uses the other device's version, Then the phone's edit is dropped and the other name shows.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Alpha", KIND: "expense" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-categories.yaml
- extendedWaitUntil:
    visible: "Alpha"
    timeout: 20000
- tapOn: "Alpha"
- extendedWaitUntil:
    visible:
      id: "categoryEditor.name"
    timeout: 15000
- runScript:
    file: ../common/api.js
    env: { ACTION: saveCategory, SLOT: B, CATEGORY: "Alpha", NEW_NAME: "Web name" }
- tapOn:
    id: "categoryEditor.name"
- eraseText: 30
- inputText: "Phone name"
- hideKeyboard
- tapOn:
    id: "categoryEditor.save"
- extendedWaitUntil:
    visible: "Changed on another device."
    timeout: 30000
- tapOn: "Phone name"
- extendedWaitUntil:
    visible:
      id: "categoryEditor.useTheirs"
    timeout: 15000
- tapOn:
    id: "categoryEditor.useTheirs"
- back
- extendedWaitUntil:
    visible: "Web name"
    timeout: 20000
- assertNotVisible: "Changed on another device."
- assertNotVisible: "Phone name"
