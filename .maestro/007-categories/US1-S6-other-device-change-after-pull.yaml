# US1-S6: Given a category renamed on another device, When the person pulls to refresh, Then the new name is shown.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US1
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Alpha", KIND: "expense" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-categories.yaml
- extendedWaitUntil:
    visible: "Alpha"
    timeout: 20000
- runScript:
    file: ../common/api.js
    env: { ACTION: saveCategory, SLOT: B, CATEGORY: "Alpha", NEW_NAME: "Alpha renamed" }
- swipe:
    start: 50%, 30%
    end: 50%, 75%
- extendedWaitUntil:
    visible: "Alpha renamed"
    timeout: 20000
