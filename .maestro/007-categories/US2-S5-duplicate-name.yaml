# US2-S5: Given a category named "Coffee", When the person creates another "Coffee", Then both are kept.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Coffee", KIND: "expense" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-categories.yaml
- extendedWaitUntil:
    visible: "Coffee"
    timeout: 20000
- tapOn:
    id: "categories.create"
- extendedWaitUntil:
    visible:
      id: "categoryEditor.name"
    timeout: 15000
- tapOn:
    id: "categoryEditor.name"
- inputText: "Coffee"
- hideKeyboard
- scrollUntilVisible:
    element:
      id: "categoryEditor.save"
- tapOn:
    id: "categoryEditor.save"
- extendedWaitUntil:
    visible:
      id: "categories.own.1"
    timeout: 15000
