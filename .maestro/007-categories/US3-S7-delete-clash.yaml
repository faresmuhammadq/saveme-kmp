# US3-S7: Given a waiting deletion of a category that was renamed on another device, When it is sent, Then the category reappears marked "Changed on another device" with "Delete anyway" and "Keep the category"; nothing is deleted on the server until the person chooses.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Alpha", KIND: "expense" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-categories.yaml
- extendedWaitUntil:
    visible: "Alpha"
    timeout: 20000
- tapOn: "Alpha"
- scrollUntilVisible:
    element:
      id: "categoryEditor.delete"
- tapOn:
    id: "categoryEditor.delete"
- runScript:
    file: ../common/api.js
    env: { ACTION: saveCategory, SLOT: B, CATEGORY: "Alpha", NEW_NAME: "Web name" }
# The confirmation is a dialog window, where test tags are not exposed (MainActivity sets
# testTagsAsResourceId on its own window only), so its buttons are found by their text.
- tapOn: "Delete category"
- extendedWaitUntil:
    visible: "Changed on another device."
    timeout: 30000
- tapOn: "Alpha"
- extendedWaitUntil:
    visible:
      id: "categoryEditor.deleteAnyway"
    timeout: 15000
- assertVisible:
    id: "categoryEditor.keepCategory"
- runScript:
    file: ../common/api.js
    env: { ACTION: getCategory, SLOT: B, CATEGORY: "Web name" }
- assertTrue: ${output.category.deleted_at == null}
