# US2-S7: Given a category deleted on another device, When the phone saves an edit to it, Then it is marked as deleted elsewhere and only "Accept the deletion" is offered; accepting removes it.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Alpha", KIND: "expense" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-categories.yaml
- extendedWaitUntil:
    visible: "Alpha"
    timeout: 20000
- tapOn: "Alpha"
- extendedWaitUntil:
    visible:
      id: "categoryEditor.name"
    timeout: 15000
- runScript:
    file: ../common/api.js
    env: { ACTION: deleteCategory, SLOT: B, CATEGORY: "Alpha" }
- tapOn:
    id: "categoryEditor.name"
- eraseText: 30
- inputText: "Edited"
- hideKeyboard
- tapOn:
    id: "categoryEditor.save"
- extendedWaitUntil:
    visible: "Changed on another device."
    timeout: 30000
- tapOn: "Edited"
- extendedWaitUntil:
    visible: "Deleted on another device."
    timeout: 15000
- assertVisible:
    id: "categoryEditor.acceptDeletion"
- assertNotVisible:
    id: "categoryEditor.keepMine"
- tapOn:
    id: "categoryEditor.acceptDeletion"
# Accepting removes the category, so the editor closes back to the list by itself (no "back").
- extendedWaitUntil:
    visible:
      id: "categories.list"
    timeout: 15000
- extendedWaitUntil:
    notVisible: "Edited"
    timeout: 20000
- assertVisible:
    id: "categories.ownEmpty"
