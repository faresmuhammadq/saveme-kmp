# US2-S8: Given a person whose email address is not verified, When they try to create a category, Then the app asks them to verify their address first and nothing is queued.
# e2e-seed: unverified-user
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-categories.yaml
- tapOn:
    id: "categories.create"
- extendedWaitUntil:
    visible: "Verify your email to do this. Check your inbox."
    timeout: 15000
- assertVisible: "Resend email"
- assertNotVisible:
    id: "categoryEditor.name"
