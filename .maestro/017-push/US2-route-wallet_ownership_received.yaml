# deferred: E2E on owner's device (owner policy 2026-10-04)
# US2: a `wallet_ownership_received` notification, tapped from the shade, opens its screen (walletDetail.transactions); the tap only navigates.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "1000000" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/simulate-push.yaml
    env: { TYPE: "wallet_ownership_received" }
- extendedWaitUntil:
    visible:
      id: "walletDetail.transactions"
    timeout: 20000
