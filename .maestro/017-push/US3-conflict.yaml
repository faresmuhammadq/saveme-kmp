# deferred: E2E on owner's device (owner policy 2026-10-04)
# US3-S4: Given the screen is open, When another phone saves different preferences and the person then saves, Then the stored values replace the edits with "These settings were changed on another device".
# e2e-seed: verified-user
# The conflict is made by api.js from a second session (slot B), as the quickstart says.
appId: com.fares.saveme
tags:
  - US3
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-notifications.yaml
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runScript:
    file: ../common/api.js
    env: { ACTION: saveNotificationPreferences, SLOT: B, BUDGET_ALERTS: "false", QUIET_START: "21:00", QUIET_END: "06:00" }
- tapOn:
    id: "notifications.category.recurring_due"
- tapOn:
    id: "notifications.save"
- extendedWaitUntil:
    visible:
      id: "notifications.message"
    timeout: 15000
- assertVisible: "These settings were changed on another device. Check them and save again."
- assertVisible: "21:00"
- assertVisible: "06:00"
