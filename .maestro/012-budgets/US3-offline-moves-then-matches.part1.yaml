# deferred: E2E on owner's device
# US3 (brief checkpoint): Given a Food run budget of 6,000 EGP with 3,500.00 spent, When the person records a 200.00 expense offline, Then the budget moves at once and says a change waits; online the note goes and the figures equal the server's. Part 1: online, the budget shows the server's figures.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US3
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "1000000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Food run", KIND: "expense" }
- runFlow:
    file: ../common/seed-budget.yaml
    env: { CATEGORY: "Food run", AMOUNT: "600000" }
- runFlow:
    file: ../common/seed-transaction.yaml
    env: { WALLET: "Alpha", AMOUNT: "350000", NOTE: "Weekly shop", CATEGORY: "Food run" }
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-budgets.yaml
- extendedWaitUntil:
    visible: ".*2,500 left · 58%.*"
    timeout: 60000
