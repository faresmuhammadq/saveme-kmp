# deferred: E2E on owner's device (owner policy 2026-10-04)
# US1: Given an unacknowledged purchased plus_monthly on the phone, When the app opens signed in, Then the server activates Plus without the person doing anything.
# e2e-seed: verified-user
# e2e-play-script: {"e2e-us1-bg-1": {"kind": "subscription", "product_id": "plus_monthly", "state": "active", "acknowledged": false, "obfuscated_account_id": "@REFERENCE@"}}
appId: com.fares.saveme
tags:
  - US1
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/play-open-devtools.yaml
- runFlow:
    file: ../common/play-script-purchase.yaml
    env: { TOKEN: "e2e-us1-bg-1", PRODUCT: "plus_monthly", PENDING: "false" }
- tapOn:
    id: "playDev.emit"
- runFlow: ../common/play-back-to-home.yaml
- runFlow: ../common/open-plan.yaml
- tapOn:
    id: "plan.refresh"
- extendedWaitUntil:
    visible:
      id: "plan.current.name"
      text: ".*Plus.*"
    timeout: 20000
- assertNotVisible:
    id: "plan.play.pending"
