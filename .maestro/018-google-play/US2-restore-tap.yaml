# deferred: E2E on owner's device (owner policy 2026-10-04)
# US2: Given a purchase on the phone and a fresh sign-in, When the person taps "Restore purchases", Then the plan is restored and the result message shows.
# e2e-seed: verified-user
# e2e-play-script: {"e2e-us2-tap-1": {"kind": "subscription", "product_id": "plus_monthly", "state": "active", "acknowledged": false, "obfuscated_account_id": "@REFERENCE@"}}
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/play-open-devtools.yaml
- runFlow:
    file: ../common/play-script-purchase.yaml
    env: { TOKEN: "e2e-us2-tap-1", PRODUCT: "plus_monthly", PENDING: "false" }
- runFlow: ../common/play-back-to-home.yaml
- runFlow: ../common/open-plan.yaml
- tapOn:
    id: "plan.restore"
- extendedWaitUntil:
    visible:
      id: "plan.restore.result"
      text: "Your purchases are restored."
    timeout: 20000
