# US4-S3: Given a wrong password, When they confirm, Then "Password is incorrect" is shown and nothing is scheduled; lock behaves as in Story 2 scenario 3.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US4
---
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Delete account"
- tapOn: "Continue"
- tapOn: "Password"
- inputText: ${E2E_PASSWORD + 'wrong'}
- hideKeyboard
- tapOn:
    id: "deleteAccount.confirm"
- extendedWaitUntil:
    visible: "Password is incorrect."
    timeout: 20000
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runScript:
    file: ../common/api.js
    env: { ACTION: me, SLOT: B }
- assertTrue: ${output.account.deletion_scheduled_for == null}
# Lock as in Story 2 scenario 3: the backend locks after 5 failures. At most 7 tries in all.
- repeat:
    times: 6
    while:
      notVisible: "Too many attempts\\. Try again in \\d+ minutes?, or reset your password\\."
    commands:
      # Appending keeps it wrong whether or not the app cleared the field.
      - tapOn: "Password"
      - inputText: "x"
      - hideKeyboard
      - tapOn:
          id: "deleteAccount.confirm"
      - extendedWaitUntil:
          visible: ".*(Password is incorrect\\.|Too many attempts).*"
          timeout: 20000
- assertVisible: "Too many attempts\\. Try again in \\d+ minutes?, or reset your password\\."
- assertVisible:
    id: "deleteAccount.confirm"
    enabled: false
