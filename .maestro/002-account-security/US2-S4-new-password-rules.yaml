# US2-S4: Given a new password shorter than 8 characters, longer than 128, or equal to the email address, When they try to submit, Then the field shows the specific rule broken before any request is sent.
# e2e-seed: verified-user
# "Before any request" is checked indirectly: server-side field errors read "Check this field.".
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Change password"
- tapOn:
    id: "changePassword.current"
- inputText: ${E2E_PASSWORD}
# Too short.
- tapOn:
    id: "changePassword.new"
- inputText: "Short7x"
- hideKeyboard
- tapOn:
    id: "changePassword.submit"
- assertVisible: "Use at least 8 characters."
- assertNotVisible: "Check this field."
# Too long: append 122 characters to "Short7x" -> 129.
- tapOn:
    id: "changePassword.new"
- inputText: "abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789abcdefghij0123456789ab"
- hideKeyboard
- tapOn:
    id: "changePassword.submit"
- assertVisible: "Use at most 128 characters."
# Equal to the email address, on a freshly opened screen.
- tapOn: "Back"
- tapOn: "Change password"
- tapOn:
    id: "changePassword.current"
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "changePassword.new"
- inputText: ${E2E_EMAIL}
- hideKeyboard
- tapOn:
    id: "changePassword.submit"
- assertVisible: "Your password can’t be your email address."
- assertNotVisible: "Check this field."
# Nothing was changed.
- runScript:
    file: ../common/api.js
    env: { ACTION: expectLogin, EXPECT: "200" }
