# US4-S7: Given a pending deletion, When the person signs in anew on any device, Then the deletion is cancelled and the "deletion cancelled" message from spec 001 is shown.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US4
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runScript:
    file: ../common/api.js
    env: { ACTION: requestDeletion, SLOT: B }
- runFlow: ../common/sign-in.yaml
- assertVisible: "Welcome back. Your account deletion was cancelled; nothing was lost."
- runScript:
    file: ../common/api.js
    env: { ACTION: me, SLOT: B }
- assertTrue: ${output.account.deletion_scheduled_for == null}
