# US1-S1: Given the person is signed in on two devices, When they open "Devices" on device A, Then both devices are listed, newest sign-in first, and device A is marked "This device" with no end action.
# e2e-seed: verified-user
# Device A is the phone; device B is a second API session named "e2e-device-b", signed in later.
appId: com.fares.saveme
tags:
  - US1
---
- runFlow: ../common/sign-in.yaml
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Devices"
- extendedWaitUntil:
    visible: "e2e-device-b"
    timeout: 20000
# This device leads in its own card; other devices follow.
- assertVisible:
    text: "(?i)This device"
    above: "e2e-device-b"
# Only B has an end action.
- assertVisible: "Sign out e2e-device-b"
- assertNotVisible: "Sign out This device.*"
