# US2-S2: Given a wrong current password, When they submit, Then "Current password is incorrect" appears on the current-password field and nothing changes.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Change password"
- tapOn:
    id: "changePassword.current"
- inputText: ${E2E_PASSWORD + 'wrong'}
- tapOn:
    id: "changePassword.new"
- inputText: "Brand-new-pass-1"
- hideKeyboard
- tapOn:
    id: "changePassword.submit"
- extendedWaitUntil:
    visible: "Current password is incorrect."
    timeout: 20000
- assertVisible:
    text: "Current password is incorrect."
    below:
      id: "changePassword.current"
# Nothing changed: the old password still signs in, the new one does not.
- runScript:
    file: ../common/api.js
    env: { ACTION: expectLogin, EXPECT: "200" }
- runScript:
    file: ../common/api.js
    env: { ACTION: expectLogin, PASSWORD: "Brand-new-pass-1", EXPECT: "401" }
