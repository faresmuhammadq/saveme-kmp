# US2-S1: Given the person is signed in, When they enter the correct current password and a valid new password and submit, Then a confirmation says the password changed and other devices were signed out, and this device stays signed in.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/sign-in.yaml
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Change password"
- tapOn:
    id: "changePassword.current"
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "changePassword.new"
- inputText: ${E2E_PASSWORD + '-new'}
- hideKeyboard
- tapOn:
    id: "changePassword.submit"
- extendedWaitUntil:
    visible: "Password changed. Your other devices were signed out."
    timeout: 20000
- runScript:
    file: ../common/api.js
    env: { ACTION: expectSession, SLOT: B, EXPECT: "401" }
# This device stays signed in, also after a relaunch.
- tapOn: "Done"
- stopApp
- launchApp
- extendedWaitUntil:
    visible: "Signed in as .+"
    timeout: 15000
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Profile"
- extendedWaitUntil:
    visible: "Display name"
    timeout: 20000
