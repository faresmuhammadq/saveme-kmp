# US2-S5: Given the password changed, When the person later signs in on another device, Then only the new password works.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Change password"
- tapOn:
    id: "changePassword.current"
- inputText: ${E2E_PASSWORD}
- tapOn:
    id: "changePassword.new"
- inputText: ${E2E_PASSWORD + '-new'}
- hideKeyboard
- tapOn:
    id: "changePassword.submit"
- extendedWaitUntil:
    visible: "Password changed. Your other devices were signed out."
    timeout: 20000
# Another device: the old password fails, the new one works.
- runScript:
    file: ../common/api.js
    env: { ACTION: expectLogin, EXPECT: "401" }
- runScript:
    file: ../common/api.js
    env: { ACTION: expectLogin, PASSWORD: "${E2E_PASSWORD}-new", EXPECT: "200" }
