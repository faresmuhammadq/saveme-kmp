# US2-S3: Given repeated wrong current passwords lock the account, When they submit again, Then the app says the account is temporarily locked and for how many minutes, and disables submit for that time.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-account.yaml
    env:
      ROW: "Change password"
- tapOn:
    id: "changePassword.new"
- inputText: "Brand-new-pass-1"
- tapOn:
    id: "changePassword.current"
- inputText: ${E2E_PASSWORD + 'wrong'}
# The backend locks after 5 failures. At most 7 tries.
- repeat:
    times: 7
    while:
      notVisible: "Too many attempts\\. Try again in \\d+ minutes?, or reset your password\\."
    commands:
      # Appending keeps it wrong whether or not the app cleared the field.
      - tapOn:
          id: "changePassword.current"
      - inputText: "x"
      - hideKeyboard
      - tapOn:
          id: "changePassword.submit"
      - extendedWaitUntil:
          visible: ".*(Current password is incorrect\\.|Too many attempts).*"
          timeout: 20000
- assertVisible: "Too many attempts\\. Try again in \\d+ minutes?, or reset your password\\."
- assertVisible:
    id: "changePassword.submit"
    enabled: false
