# deferred: E2E on owner's device
# US4: Given a gam'eya of 10 monthly rounds of 1,000.00 with the payout in round 4, When the person previews it, Then the payout shows 10,000.00 in round 4.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US4
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow:
    file: ../common/seed-wallet.yaml
    env: { NAME: "Alpha", OPENING: "1000000" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Gameya", KIND: "expense" }
- runFlow:
    file: ../common/seed-category.yaml
    env: { NAME: "Payout", KIND: "income" }
- runFlow: ../common/sign-in.yaml
- runFlow:
    file: ../common/open-recurring.yaml
    env: { WALLET: "Alpha" }
- tapOn:
    id: "recurring.add"
- extendedWaitUntil:
    visible:
      id: "ruleEditor.preset.gameya"
    timeout: 15000
- tapOn:
    id: "ruleEditor.preset.gameya"
- extendedWaitUntil:
    visible:
      id: "ruleEditor.moreDetails"
    timeout: 15000
- tapOn:
    id: "ruleEditor.moreDetails"
- tapOn:
    id: "ruleEditor.amount"
- inputText: "1000"
- hideKeyboard
- tapOn:
    id: "ruleEditor.category"
- extendedWaitUntil:
    visible: "Gameya"
    timeout: 15000
- tapOn: "Gameya"
- tapOn:
    id: "ruleEditor.rounds"
- inputText: "10"
- hideKeyboard
- tapOn:
    id: "ruleEditor.payoutRound"
- inputText: "4"
- hideKeyboard
- tapOn:
    id: "ruleEditor.payoutCategory"
- extendedWaitUntil:
    visible: "Payout"
    timeout: 15000
- tapOn: "Payout"
- assertVisible:
    id: "ruleEditor.preview"
- assertVisible: "EGP 10,000.00"
- tapOn:
    id: "ruleEditor.save"
- extendedWaitUntil:
    visible:
      id: "recurring.rule.0"
    timeout: 15000
