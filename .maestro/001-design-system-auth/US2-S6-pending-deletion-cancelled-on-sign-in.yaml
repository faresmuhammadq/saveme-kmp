# US2-S6: Given an account pending deletion, When the person signs in, Then they are signed in and told that the scheduled deletion was cancelled.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runScript:
    file: ../common/api.js
    env: { ACTION: requestDeletion, SLOT: B }
- runFlow: ../common/sign-in.yaml
- assertVisible: "Welcome back. Your account deletion was cancelled; nothing was lost."
- runScript:
    file: ../common/api.js
    env: { ACTION: me, SLOT: B }
- assertTrue: ${output.account.deletion_scheduled_for == null}
