# US2-S2: Given a wrong password or an unregistered address, When the person submits, Then the same message is shown in both cases ("email or password is incorrect") and the password field is cleared.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US2
---
- runFlow: ../common/launch-clean.yaml
- tapOn:
    id: "entry.signIn"
# Wrong password for a registered address.
- runFlow:
    file: ../common/sign-in-attempt.yaml
    env:
      E2E_PASSWORD: ${E2E_PASSWORD + 'wrong'}
- extendedWaitUntil:
    visible: "Email or password is incorrect."
    timeout: 20000
# Password cleared: revealing the field must not show what was typed.
- tapOn: "Show password"
- assertNotVisible: ".*${E2E_PASSWORD}wrong.*"
# Unregistered address, on a freshly opened sign-in screen.
- tapOn: "Back"
- tapOn:
    id: "entry.signIn"
- runFlow:
    file: ../common/sign-in-attempt.yaml
    env:
      E2E_EMAIL: ${'nobody-' + E2E_EMAIL}
      E2E_PASSWORD: "Unregistered-123"
- extendedWaitUntil:
    visible: "Email or password is incorrect."
    timeout: 20000
- assertNotVisible: ".*Unregistered-123.*"
