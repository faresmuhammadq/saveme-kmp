# deferred: E2E on owner's device
# US1 (the brief's first checkpoint): Given three EGP wallets with a salary of 10,000, groceries 3,500, transport 1,200 and an own category 800, When Home -> Reports opens, Then income is 10,000.00, expenses 5,500.00, net 4,500.00 and the top categories show 64% / 22% / 15%.
# e2e-seed: verified-user
appId: com.fares.saveme
tags:
  - US1
---
- runScript:
    file: ../common/api.js
    env: { ACTION: login, SLOT: B }
- runFlow: ../common/seed-reports.yaml
- runFlow: ../common/sign-in.yaml
- runFlow: ../common/open-reports.yaml
- extendedWaitUntil:
    visible:
      id: "reports.summary.income"
    timeout: 60000
- assertVisible:
    id: "reports.summary.income"
    text: ".*10,000.00.*"
- assertVisible:
    id: "reports.summary.expenses"
    text: ".*5,500.00.*"
- assertVisible:
    id: "reports.summary.net"
    text: ".*4,500.00.*"
- assertVisible:
    id: "reports.category.0"
    text: ".*Groceries.*"
- assertVisible:
    id: "reports.category.0"
    text: ".*64%.*"
- assertVisible:
    id: "reports.category.1"
    text: ".*Transport.*22%.*"
- assertVisible:
    id: "reports.category.2"
    text: ".*Pets.*15%.*"
# The transfer between two EGP wallets appears nowhere; the USD wallet is named, never added.
- assertVisible:
    id: "reports.summary.transfers_out"
    text: ".*0.00.*"
- assertVisible:
    id: "reports.excluded"
    text: ".*Savings \\(USD\\).*"
