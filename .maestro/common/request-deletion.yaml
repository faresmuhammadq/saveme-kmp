# From Home: schedules account deletion through the UI with ${E2E_PASSWORD} and returns to Home,
# which then shows the pending-deletion notice.
appId: com.fares.saveme
tags:
  - subflow
---
- runFlow:
    file: open-account.yaml
    env:
      ROW: "Delete account"
- tapOn: "Continue"
# Spec 016: the plan is read first; with no shared wallet the review follows, and its button leads to the password.
- extendedWaitUntil:
    visible:
      id: "delete.review"
    timeout: 20000
- tapOn:
    id: "delete.review.submit"
- tapOn: "Password"
- inputText: ${E2E_PASSWORD}
- hideKeyboard
- tapOn: "Delete my account"
- extendedWaitUntil:
    visible: "Your account will be deleted on .*\\. You can cancel until then\\."
    timeout: 20000
- tapOn: "Done"
- extendedWaitUntil:
    visible: "Cancel deletion"
    timeout: 20000
