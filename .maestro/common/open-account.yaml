# From Home: opens the Account screen and, when ROW is given, one of its rows
# ("Profile", "Devices", "Change password", "Delete account").
appId: com.fares.saveme
tags:
  - subflow
---
- tapOn: "Account"
- extendedWaitUntil:
    visible: "Devices"
    timeout: 10000
- runFlow:
    when:
      true: ${typeof ROW !== 'undefined' && ROW !== ''}
    commands:
      - tapOn: ${ROW}
