# Signs in from a clean launch with ${E2E_EMAIL} / ${E2E_PASSWORD} and waits for Home.
# Needs a flow header `# e2e-seed: verified-user` (or unverified-user).
appId: com.fares.saveme
tags:
  - subflow
---
- runFlow: launch-clean.yaml
- tapOn:
    id: "entry.signIn"
- runFlow: sign-in-attempt.yaml
# The tab bar only exists once signed in.
- extendedWaitUntil:
    visible:
      id: "tab.home"
    timeout: 20000
