name: android

# Forgejo (git.lab.internal) port of .github/workflows/_android-build.yml, run by the self-hosted runner
# in the forge VM. GitHub ignores .forgejo/, and Forgejo ignores .github/ once this folder exists.
#
#   push to staging   -> signed staging APK (com.fares.saveme.staging), Forgejo pre-release
#   push to main      -> signed production APK (com.fares.saveme), Forgejo release
#   workflow_dispatch -> the chosen flavor, from the dispatched ref
#
# Every environment is signed with the same key, so each APK installs over the previous one without losing data.
#
# Secrets: ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
#          CI_TOKEN (Forgejo access token with write:repository, publishes the release).
# Variables (optional): STAGING_API_HOST, PROD_API_HOST, VERSION_CODE_BASE.

on:
  push:
    branches:
      - staging
      - main
  workflow_dispatch:
    inputs:
      flavor:
        description: Flavor to build
        required: true
        type: choice
        default: staging
        options:
          - staging
          - prod

concurrency:
  group: android-${{ inputs.flavor || (github.ref == 'refs/heads/main' && 'prod') || 'staging' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The first build without a Gradle cache downloads every dependency.
    timeout-minutes: 120
    env:
      FLAVOR: ${{ inputs.flavor || (github.ref == 'refs/heads/main' && 'prod') || 'staging' }}
      # Backend host[:port] baked into the build as its default (changeable in the app); the flavor picks the scheme.
      HOST: ${{ (inputs.flavor || (github.ref == 'refs/heads/main' && 'prod') || 'staging') == 'prod' && (vars.PROD_API_HOST || 'saveme-production.lab.internal') || (vars.STAGING_API_HOST || 'saveme-staging.lab.internal') }}
      # Forgejo run numbers start at 1; the GitHub builds used 100 + run number. The base keeps every forge build
      # above them, so it installs over a GitHub-built APK.
      VERSION_CODE_BASE: ${{ vars.VERSION_CODE_BASE || '1000' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 21

      # The runner image has no Android SDK; AGP downloads the platform and build-tools it needs.
      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the obsolete `tools` package, which cmdline-tools 16 no longer has.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      # GitHub release assets (where services.gradle.org redirects) are slow and erratic from the lab network,
      # so a copy of the wrapper's distribution is kept in the forge's generic package registry:
      #   curl -u fares:<token> --upload-file gradle-<v>-bin.zip \
      #     https://git.lab.internal/api/packages/fares/generic/gradle/<v>/gradle-<v>-bin.zip
      # curl fetches it (it trusts the lab CA through the system bundle; the JDK's own trust store does not) and
      # the wrapper installs it from the local file, still checking distributionSha256Sum.
      # No copy: keep the official URL.
      - name: Use the forge copy of the Gradle distribution
        run: |
          props=gradle/wrapper/gradle-wrapper.properties
          file=$(sed -n 's/^distributionUrl=.*\/\(gradle-[^/]*\.zip\)$/\1/p' "$props")
          version=$(echo "$file" | sed -E 's/^gradle-(.+)-(bin|all)\.zip$/\1/')
          mirror="$GITHUB_SERVER_URL/api/packages/fares/generic/gradle/$version/$file"
          if curl -sf -o "$RUNNER_TEMP/$file" "$mirror"; then
            sed -i "s|^distributionUrl=.*|distributionUrl=file\\\\:$RUNNER_TEMP/$file|" "$props"
            echo "Using $mirror"
          else
            echo "No forge copy of $file; downloading from services.gradle.org"
          fi
          grep '^distributionUrl=' "$props"

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build signed APK
        env:
          SAVEME_KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          SAVEME_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SAVEME_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          SAVEME_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          task="assemble$(echo "${FLAVOR:0:1}" | tr a-z A-Z)${FLAVOR:1}Release"
          ./gradlew ":androidApp:$task" \
            "-P${FLAVOR}ApiHost=$HOST" \
            "-PversionCode=$((VERSION_CODE_BASE + GITHUB_RUN_NUMBER))" \
            --no-daemon --stacktrace

      - name: Verify signature and name the APK
        id: apk
        run: |
          version=$(sed -n 's/^versionName=//p' gradle.properties | tr -d '[:space:]')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "versionName '$version' is not semver"; exit 1; }
          apk=$(ls androidApp/build/outputs/apk/"$FLAVOR"/release/*.apk | head -n1)
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n1)
          "$apksigner" verify --print-certs "$apk" | tee "$RUNNER_TEMP/certs.txt"
          grep -q "certificate SHA-256 digest" "$RUNNER_TEMP/certs.txt"
          mkdir -p dist
          cp "$apk" "dist/saveme-${FLAVOR}-${version}.apk"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "file=dist/saveme-${FLAVOR}-${version}.apk" >> "$GITHUB_OUTPUT"
          echo "tag=${FLAVOR}-v${version}-build${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # actions/upload-artifact@v4 does not work against Forgejo; this is Forgejo's fork.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: saveme-${{ env.FLAVOR }}-apk
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error
          retention-days: 30

      # Needed to de-obfuscate crash stack traces of this exact build.
      - uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: saveme-${{ env.FLAVOR }}-r8-mapping
          path: androidApp/build/outputs/mapping/${{ env.FLAVOR }}Release/mapping.txt
          if-no-files-found: error
          retention-days: 90

      # Staging builds are pre-releases so they never become the repository's "latest" release.
      - name: Publish release
        uses: https://code.forgejo.org/actions/forgejo-release@v2
        with:
          direction: upload
          url: ${{ github.server_url }}
          repo: ${{ github.repository }}
          token: ${{ secrets.CI_TOKEN }}
          tag: ${{ steps.apk.outputs.tag }}
          sha: ${{ github.sha }}
          title: saveme-${{ env.FLAVOR }}-${{ steps.apk.outputs.version }} (build ${{ github.run_number }})
          release-dir: dist
          release-notes: "Save Me ${{ env.FLAVOR }} ${{ steps.apk.outputs.version }} (build ${{ github.run_number }}), commit ${{ github.sha }}. Installs over the previous ${{ env.FLAVOR }} build."
          prerelease: ${{ env.FLAVOR != 'prod' }}
          override: true

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
